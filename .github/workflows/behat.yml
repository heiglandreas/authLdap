name: Behat Tests
on:
  pull_request:
  push:
    branches:
      - 'master'
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      PORT_LDAP: 3389
      PORT_LDAPS: 6363
      LDAP_ADMIN_PASSWORD: ${{ secrets.LDAP_ADMIN_PASSWORD }}
      LDAP_LOG_LEVEL: 0
    strategy:
      fail-fast: false
      matrix:
        php-version: ['8.3', '8.4', '8.5']
        wordpress-version: ['6.6', '6.7', '6.8', '6.9', '7.0']

    name: Test on PHP ${{ matrix.php-version }}/WordPress ${{ matrix.wordpress-version }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # 7.0.1
        with:
          persist-credentials: false
#      - name: Docker Compose Pull
#        run: docker compose pull
#      - name: Cache Docker images
#        id: docker-cache
#        uses: ScribeMD/docker-cache@0.5.0
#        with:
#          key:
#            docker-${{ runner.os }}-${{ matrix.php-version }}-${{ matrix.wordpress-version }}-${{ hashFiles('compose.yml') }}
      - name: Build the docker compose stack
        if: steps.docker-cache.outputs.cache-hit != 'true'
        run:  docker compose build --build-arg PHP_BUILD_VERSION=$PHP_BUILD_VERSION --build-arg WORDPRESS_VERSION=$WORDPRESS_VERSION wp
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress-version }}
          PHP_BUILD_VERSION: ${{ matrix.php-version }}

      - name: run the stack
        run: docker compose -f compose.yml up -d
        env:
          WORDPRESS_VERSION: ${{ matrix.wordpress-version }}
          PHP_BUILD_VERSION: ${{ matrix.php-version }}
      - name: Check running containers
        run: docker ps -a
      - name: Check logs
        run: docker compose logs openldap
      - name: Setup PHP
        uses: shivammathur/setup-php@f3e473d116dcccaddc5834248c87452386958240 #2.37.2
        with:
          php-version: ${{ matrix.php-version }}
          tools: phive
          ini-values: "memory_limit=-1"
      - name: install dependencies
        run: composer install
      - name: install behat
        run: |
          composer require --dev behat/behat
      - name: run behat
        run: |
          docker compose exec wp bash -c "wp --allow-root core version"
          docker compose exec wp bash -c "php -v"
          docker compose exec wp bash -c "cd wp-content/plugins/authldap && ./vendor/bin/behat"
      - name: Check logs
        if: ${{ failure() }}
        run: docker compose logs
